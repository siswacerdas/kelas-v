<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pustaka Belajar · Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/design-system.css" />
<link rel="stylesheet" href="materi/assets/materi.css" />
<link rel="stylesheet" href="pustaka-belajar/assets/pustaka-belajar.css" />
<style>
  #checking { padding: 4rem 1.5rem; text-align: center; color: var(--ink-3); font-size: 14px; }
  #topbar { border-bottom-color: #5b6ee1; }
  #topbar .brand span { color: #8b9cf5; }
  #topbar a.back { color: rgba(255,255,255,0.75); font-size: 12.5px; text-decoration: none; font-weight: 500; }
  #topbar a.back:hover { color: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="checking">Memeriksa akses…</div>

<div id="app-pustaka" class="hidden">
  <div id="topbar">
    <div class="brand">Pustaka Belajar <span>·</span> Kelas 5</div>
    <a class="back" href="../index.html">← Kembali ke Beranda</a>
  </div>

  <main class="pb-page">
    <div class="pb-welcome">
      <h1>📄 Pustaka Belajar</h1>
      <p>Materi presentasi dari guru — dibaca di sini, tidak perlu diunduh.</p>
    </div>

    <div class="pb-toolbar">
      <span class="pb-toolbar-label">Filter mapel</span>
    </div>
    <div class="pb-filter-chips" id="pb-filter-chips"></div>
    <div id="pb-list">
      <div class="pb-skel-grid" aria-hidden="true">
        <div class="pb-skel"></div><div class="pb-skel"></div>
        <div class="pb-skel"></div><div class="pb-skel"></div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="../assets/js/role-guard.js"></script>
<script src="mpls/assets/config.js"></script>
<script src="pustaka-belajar/assets/pustaka-belajar-data.js"></script>
<script src="../assets/js/lazy-images.js" defer></script>
<script src="pustaka-belajar/assets/pustaka-belajar-landing.js"></script>
<script>
  document.addEventListener("role-verified", () => {
    const c = document.getElementById("checking");
    if (c) c.remove();
    document.getElementById("app-pustaka").classList.remove("hidden");
    window.PustakaBelajarLanding.init();
  });
  document.addEventListener("DOMContentLoaded", () =>
    window.guardRolePage(["siswa", "guru", "orangtua"], "../index.html")
  );
</script>
</body>
</html>
