<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pustaka Belajar · Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="materi/assets/materi.css" />
<link rel="stylesheet" href="pustaka-belajar/assets/pustaka-belajar.css" />
<style>
  .ma-page-container { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .ma-page-container h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 0.25rem; }
  .ma-subtitle { font-size: 13px; color: var(--ink-3); margin-bottom: 0.25rem; }
</style>
</head>
<body class="ma-root">

<div id="checking">Memeriksa akses…</div>

<div id="app-pustaka" class="ma-hidden">
  <div class="ma-topbar">
    <div class="ma-brand">Pustaka Belajar <span>·</span> Kelas 5</div>
    <a class="ma-back" href="../index.html">← Kembali ke Beranda</a>
  </div>

  <div class="ma-page-container">
    <h1>📄 Pustaka Belajar</h1>
    <p class="ma-subtitle">Materi presentasi (PDF) yang dibagikan guru pendamping — dibaca langsung di sini, tidak untuk diunduh.</p>

    <div class="pb-filter-chips" id="pb-filter-chips"></div>
    <div id="pb-list"><div class="pb-empty">Memuat…</div></div>
  </div>
</div>

<script type="module" src="../assets/js/role-guard.js"></script>
<script src="mpls/assets/config.js"></script>
<script src="pustaka-belajar/assets/pustaka-belajar-data.js"></script>
<script src="pustaka-belajar/assets/pustaka-belajar-landing.js"></script>
<script>
  document.addEventListener("role-verified", () => {
    document.getElementById("checking").remove();
    document.getElementById("app-pustaka").classList.remove("ma-hidden");
    window.PustakaBelajarLanding.init();
  });
  // Akses sama dengan Galeri Visual (yang digantikan fitur ini): siswa, guru, DAN orangtua —
  // materi presentasi guru pendamping juga relevan untuk orang tua mendampingi belajar di rumah.
  document.addEventListener("DOMContentLoaded", () => window.guardRolePage(['siswa','guru','orangtua'], '../index.html'));
</script>
</body>
</html>
