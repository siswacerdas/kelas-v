<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ayo Belajar! · Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;650&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/design-system.css" />
<link rel="stylesheet" href="../assets/css/belajar-shell.css" />
<style>
  :root {
    --m-bahasa-indonesia: #8c3d5f;
    --m-matematika:       #1f6f78;
    --m-ipas:             #3f7d4a;
    --m-pai:              #0f6b52;
    --m-pancasila:        #a13d3d;
    --m-seni-budaya:      #c9861f;
    --m-pjok:             #d9541c;
    --m-bahasa-inggris:   #4a5d8c;
    --step-accent:        #2a9d6f;
  }

  #checking {
    padding: 4rem 1.5rem;
    text-align: center;
    color: var(--ink-3);
    font-size: 14px;
  }

  #topbar { border-bottom-color: var(--step-accent); }
  #topbar .brand span { color: var(--step-accent); }
  #topbar a.back {
    color: rgba(255, 255, 255, 0.75);
    font-size: 12.5px;
    text-decoration: none;
    font-weight: 500;
  }
  #topbar a.back:hover { color: #fff; }

  .bl-welcome {
    background: linear-gradient(180deg, #e8f5ef 0%, var(--paper) 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem var(--s-5) 1.35rem;
  }
  .bl-welcome-inner {
    max-width: var(--content-max);
    margin: 0 auto;
  }
  .bl-step-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0.45rem;
  }
  .bl-step-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: var(--step-accent);
    padding: 4px 11px;
    border-radius: var(--r-full);
  }
  .bl-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .bl-title {
    font-family: var(--font-display);
    font-size: clamp(1.45rem, 4vw, 1.9rem);
    font-weight: 700;
    color: var(--ink);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .bl-sub {
    margin-top: 0.4rem;
    font-size: 13.5px;
    color: var(--ink-3);
    max-width: 40em;
    line-height: 1.55;
  }

  .bl-container {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: var(--s-6) var(--s-4) var(--s-10);
  }

  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.35rem;
  }
  .filter-chip {
    padding: 7px 14px;
    border-radius: var(--r-full);
    font-size: 12.5px;
    font-weight: 600;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-2);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .filter-chip:hover {
    border-color: var(--border-2);
    box-shadow: var(--shadow-sm);
  }
  .filter-chip.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .group-title {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 1.65rem 0 0.75rem;
    padding: 0.55rem 0.15rem;
    border-bottom: 1px solid var(--border);
  }
  .group-title:first-child { margin-top: 0.25rem; }
  .group-title .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--m-color, var(--step-accent));
    flex-shrink: 0;
  }
  .group-title .count {
    font-weight: 500;
    color: var(--ink-3);
    font-size: 12px;
  }
  .group-title .chevron {
    margin-left: auto;
    font-size: 11px;
    color: var(--ink-3);
    transition: transform 0.15s;
  }
  .group-title.collapsed .chevron { transform: rotate(-90deg); }
  .group-body { display: block; }
  .group-body.collapsed { display: none; }

  .subgroup-title {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--m-color, var(--ink-3));
    margin: 1rem 0 0.55rem 2px;
  }

  .modul-card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 1rem 1.05rem;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .modul-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--m-color, var(--step-accent));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.22s ease;
  }
  .modul-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--border-2);
  }
  .modul-card:hover::after { transform: scaleX(1); }
  .modul-card:active { transform: translateY(-1px); }

  .modul-card .m-icon {
    font-size: 1.45rem;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .modul-card .m-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .modul-card .m-title {
    font-weight: 650;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 1.35;
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .modul-card .m-ringkasan {
    font-size: 12.5px;
    color: var(--ink-3);
    line-height: 1.5;
  }
  .modul-card .m-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
  }
  .modul-card .m-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 9px;
    border-radius: var(--r-full);
    background: var(--paper-2);
    color: var(--ink-3);
  }
  .modul-card .m-badge.interaktif {
    background: rgba(42, 157, 111, 0.12);
    color: #1e5c42;
  }
  .modul-card .m-badge.tautan {
    background: rgba(46, 111, 188, 0.1);
    color: #1e4a7a;
  }
  .modul-card .m-badge.segera {
    background: rgba(232, 160, 32, 0.14);
    color: #8a5a00;
  }
  .modul-card .m-arrow {
    flex-shrink: 0;
    color: var(--ink-3);
    font-size: 15px;
    margin-top: 4px;
    transition: color 0.15s, transform 0.15s;
  }
  .modul-card:hover .m-arrow {
    color: var(--m-color, var(--step-accent));
    transform: translateX(2px);
  }

  .empty-state {
    padding: 2.25rem 1.25rem;
    text-align: center;
    color: var(--ink-3);
    font-size: 13.5px;
    background: var(--paper-2);
    border-radius: var(--r-lg);
    border: 1px dashed var(--border);
  }

  .cekprog-tombol {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 15px;
    border-radius: var(--r-full);
    border: 1.5px solid rgba(46, 111, 188, 0.35);
    background: rgba(46, 111, 188, 0.08);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 1.15rem;
    transition: background 0.15s, border-color 0.15s;
  }
  .cekprog-tombol:hover {
    background: rgba(46, 111, 188, 0.14);
    border-color: var(--accent);
  }
  .cekprog-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 1.05rem 1.15rem;
    margin-bottom: 1.25rem;
    font-size: 13px;
    line-height: 1.55;
    box-shadow: var(--shadow-sm);
  }
  .cekprog-catatan {
    color: var(--ink-3);
    font-size: 12px;
    margin-bottom: 0.75rem;
    line-height: 1.5;
  }
  .cekprog-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .cekprog-item:first-of-type { border-top: none; padding-top: 4px; }
  .cekprog-item .ci-judul { flex: 1; font-weight: 650; color: var(--ink); font-size: 13.5px; }
  .cekprog-item .ci-mapel { color: var(--ink-3); font-size: 11.5px; margin-top: 2px; }
  .cekprog-item a.ci-buka {
    flex-shrink: 0;
    padding: 6px 13px;
    border-radius: var(--r-full);
    background: var(--step-accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    transition: background 0.15s;
  }
  .cekprog-item a.ci-buka:hover { background: #238a5f; }
  .cekprog-kosong {
    color: var(--ink-3);
    font-style: italic;
    font-size: 13px;
    padding: 0.35rem 0;
  }

  @media (max-width: 480px) {
    .bl-welcome { padding: 1.25rem var(--s-4) 1.15rem; }
    .bl-container { padding: var(--s-5) var(--s-3) var(--s-8); }
    .modul-card { padding: 0.9rem 0.95rem; gap: 12px; }
    .modul-card .m-title { font-size: 13.5px; }
  }
</style>
</head>
<body class="bl-has-shell" data-belajar-step="1">

<div id="checking">Memeriksa akses…</div>

<div id="app-modul" class="hidden">
  <div id="topbar">
    <div class="brand">Ayo Belajar! <span>·</span> Kelas 5</div>
    <a class="back" href="../index.html">← Kembali ke Beranda</a>
  </div>

  <div class="bl-welcome">
    <div class="bl-welcome-inner">
      <div class="bl-step-row">
        <span class="bl-step-pill">Langkah 1</span>
        <span class="bl-eyebrow">Jalur Belajar</span>
      </div>
      <h1 class="bl-title">🚀 Ayo Belajar!</h1>
      <p class="bl-sub">Mulai dari sini — modul interaktif per tujuan pembelajaran, langkah demi langkah. Pilih mata pelajaran, lalu ketuk judul untuk mulai.</p>
    </div>
  </div>

  <div class="bl-container">
    <div id="cek-progres-wrap"></div>

    <div class="filter-row" id="filter-row"></div>
    <div id="list-modul"><div class="empty-state">Memuat modul…</div></div>
  </div>
</div>

<script src="modul/assets/modul-index.js"></script>
<script src="modul/assets/cek-progres-tersimpan.js"></script>
<script src="../assets/js/belajar-shell.js"></script>
<script type="module" src="../assets/js/role-guard.js"></script>
<script type="module">
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  const app = getApps()[0];
  const db = getFirestore(app);

  const MAPEL_META = {
    "Bahasa Indonesia": { color: "var(--m-bahasa-indonesia)", icon: "📝" },
    "Matematika": { color: "var(--m-matematika)", icon: "🔢" },
    "IPAS": { color: "var(--m-ipas)", icon: "🔬" },
    "Pendidikan Pancasila": { color: "var(--m-pancasila)", icon: "🏛" },
    "Seni Budaya": { color: "var(--m-seni-budaya)", icon: "🎨" },
    "PJOK": { color: "var(--m-pjok)", icon: "⚽" },
    "Bahasa Inggris": { color: "var(--m-bahasa-inggris)", icon: "🗣" },
    "Al-Islam": { color: "var(--m-pai)", icon: "📖" }
  };
  function metaFor(mapel) { return MAPEL_META[mapel] || { color: "var(--step-accent)", icon: "📚" }; }

  let allItems = [];
  let activeMapel = "Semua";
  const collapsedMapel = new Set();

  function esc(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&" + "amp;",
      "<": "&" + "lt;",
      ">": "&" + "gt;",
      '"': "&" + "quot;",
      "'": "&#39;"
    }[c]));
  }

  async function loadModul() {
    const local = (window.MODUL_INDEX || []).map((it) => {
      const meta = metaFor(it.mapel);
      return {
        ...it,
        mapelColor: it.mapelColor || meta.color,
        mapelIcon: it.mapelIcon || meta.icon,
        source: "local",
        href: "modul/" + it.file
      };
    });

    let external = [];
    try {
      const snap = await getDocs(collection(db, "modul"));
      snap.forEach((d) => {
        const data = d.data();
        const mapel = data.mapel || "(Tanpa Mapel)";
        const meta = metaFor(mapel);
        const urlOk = data.url_file && /^https?:\/\//.test(data.url_file);
        if (!urlOk) return;
        external.push({
          mapel,
          mapelColor: meta.color,
          mapelIcon: meta.icon,
          tema: data.tema || "Lainnya",
          urutan: data.urutan || 0,
          judul: data.judul || "-",
          ringkasan: "",
          status: "selesai",
          source: "external",
          href: data.url_file
        });
      });
    } catch (err) {
      console.warn("Gagal memuat modul eksternal dari Firestore (modul lokal tetap ditampilkan):", err);
    }

    allItems = [...local, ...external];
    renderFilters();
    renderList();
  }

  function renderFilters() {
    const mapelList = ["Semua", ...new Set(allItems.map((it) => it.mapel))];
    const wrap = document.getElementById("filter-row");
    wrap.innerHTML = "";
    mapelList.forEach((m) => {
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (m === activeMapel ? " active" : "");
      chip.textContent = m;
      chip.onclick = () => { activeMapel = m; renderFilters(); renderList(); };
      wrap.appendChild(chip);
    });
  }

  function renderList() {
    const wrap = document.getElementById("list-modul");
    if (allItems.length === 0) {
      wrap.innerHTML = '<div class="empty-state">Belum ada modul yang ditambahkan. Modul baru akan muncul di sini.</div>';
      return;
    }
    const filtered = activeMapel === "Semua" ? allItems : allItems.filter((it) => it.mapel === activeMapel);
    if (filtered.length === 0) {
      wrap.innerHTML = '<div class="empty-state">Belum ada modul untuk mapel ini.</div>';
      return;
    }

    const grouped = {};
    filtered.forEach((it) => { (grouped[it.mapel] = grouped[it.mapel] || []).push(it); });

    wrap.innerHTML = "";
    Object.keys(grouped).sort().forEach((mapel) => {
      const items = grouped[mapel];
      const color = items[0].mapelColor;
      const icon = items[0].mapelIcon;
      const groupId = "grp-" + mapel.replace(/[^a-zA-Z0-9]/g, "-");
      const wasCollapsed = collapsedMapel.has(mapel);

      const title = document.createElement("div");
      title.className = "group-title" + (wasCollapsed ? " collapsed" : "");
      title.style.setProperty("--m-color", color);
      title.innerHTML = `<span class="dot"></span> ${esc(mapel)} <span class="count">(${items.length})</span><span class="chevron">▾</span>`;
      title.onclick = () => {
        if (collapsedMapel.has(mapel)) collapsedMapel.delete(mapel);
        else collapsedMapel.add(mapel);
        renderList();
      };
      wrap.appendChild(title);

      const body = document.createElement("div");
      body.className = "group-body" + (wasCollapsed ? " collapsed" : "");
      body.id = groupId;
      wrap.appendChild(body);

      const byTema = {};
      items.forEach((it) => { (byTema[it.tema || "Lainnya"] = byTema[it.tema || "Lainnya"] || []).push(it); });

      Object.keys(byTema).forEach((tema) => {
        byTema[tema].sort((a, b) => (a.urutan || 0) - (b.urutan || 0));

        const subTitle = document.createElement("div");
        subTitle.className = "subgroup-title";
        subTitle.style.setProperty("--m-color", color);
        subTitle.textContent = tema;
        body.appendChild(subTitle);

        byTema[tema].forEach((it) => {
          const card = document.createElement("a");
          card.className = "modul-card";
          card.style.setProperty("--m-color", color);
          card.href = it.href;
          if (it.source === "external") { card.target = "_blank"; card.rel = "noopener"; }

          const badges = [];
          if (it.source === "local") {
            badges.push('<span class="m-badge interaktif">🧩 Interaktif</span>');
          } else {
            badges.push('<span class="m-badge tautan">🔗 Tautan</span>');
          }
          if (it.status === "segera") {
            badges.push('<span class="m-badge segera">Segera hadir</span>');
          }

          card.innerHTML = `
            <div class="m-icon">${it.icon || icon}</div>
            <div class="m-body">
              <div class="m-title">${esc(it.judul)}</div>
              ${it.ringkasan ? `<div class="m-ringkasan">${esc(it.ringkasan)}</div>` : ""}
              <div class="m-meta">${badges.join("")}</div>
            </div>
            <div class="m-arrow">→</div>
          `;
          body.appendChild(card);
        });
      });
    });
  }

  document.addEventListener("role-verified", () => {
    document.getElementById("checking").remove();
    document.getElementById("app-modul").classList.remove("hidden");
    loadModul();
  });
  document.addEventListener("DOMContentLoaded", () => window.guardRolePage(['siswa','guru','orangtua'], '../index.html'));
</script>
</body>
</html>
