<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ayo Belajar! · Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a2e; --ink-2: #3d3d5c; --ink-3: #7b7b9a;
    --paper: #faf9f6; --paper-2: #f0eee8; --paper-3: #e2dfd6;
    --accent: #2e6fbc; --accent-2: #e8a020; --accent-3: #2a9d6f;
    --border: rgba(26,26,46,0.10); --r: 10px;
    /* Warna per mapel — disalin dari pages/materi/assets/materi.css supaya
       satu mapel selalu tampil dengan warna yang sama di seluruh situs. */
    --m-bahasa-indonesia: #8c3d5f;
    --m-matematika:       #1f6f78;
    --m-ipas:             #3f7d4a;
    --m-pai:              #0f6b52;
    --m-pancasila:        #a13d3d;
    --m-seni-budaya:      #c9861f;
    --m-pjok:             #d9541c;
    --m-bahasa-inggris:   #4a5d8c;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
  #topbar {
    position: sticky; top: 0; z-index: 100; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.5rem; height: 52px; border-bottom: 2px solid var(--accent-3);
  }
  #topbar .brand { font-family: 'Playfair Display', serif; font-size: 1.05rem; }
  #topbar .brand span { color: var(--accent-3); }
  #topbar a.back { color: rgba(255,255,255,0.75); font-size: 12px; text-decoration: none; }
  #topbar a.back:hover { color: #fff; }
  .container { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 0.25rem; }
  .subtitle { font-size: 13px; color: var(--ink-3); margin-bottom: 1.5rem; }
  #checking { padding: 4rem 1.5rem; text-align: center; color: var(--ink-3); font-size: 14px; }
  .hidden { display: none !important; }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .filter-chip {
    padding: 6px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
    background: #fff; border: 1px solid var(--border); color: var(--ink-2); cursor: pointer;
  }
  .filter-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .group-title {
    display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 700; color: var(--ink-2);
    margin: 1.5rem 0 0.7rem; padding-bottom: 6px; border-bottom: 1.5px solid var(--paper-3);
  }
  .group-title .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--m-color, var(--accent)); flex-shrink: 0; }
  .group-title .count { font-weight: 400; color: var(--ink-3); font-size: 12px; }
  .group-title .chevron { margin-left: auto; font-size: 11px; color: var(--ink-3); transition: transform .15s; }
  .group-title.collapsed .chevron { transform: rotate(-90deg); }
  .group-body { display: block; }
  .group-body.collapsed { display: none; }

  .subgroup-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--m-color, var(--ink-3)); margin: 0.9rem 0 0.4rem;
  }

  .modul-card {
    background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--m-color, var(--accent-3));
    border-radius: 0 var(--r) var(--r) 0; padding: 0.85rem 1rem; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    text-decoration: none; color: inherit;
  }
  .modul-card .m-icon { font-size: 20px; flex-shrink: 0; }
  .modul-card .m-body { flex: 1; min-width: 0; }
  .modul-card .m-title { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .modul-card .m-ringkasan { font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.5; }
  .modul-card .m-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px;
    background: var(--paper-2); color: var(--ink-3);
  }
  .modul-card .m-badge.interaktif { background: #e5f2ec; color: #1e4d3b; }
  .modul-card .m-arrow { flex-shrink: 0; color: var(--m-color, var(--accent-3)); font-size: 15px; }
  .modul-card:hover { border-color: var(--m-color, var(--accent-3)); }
  .empty-state { padding: 2rem; text-align: center; color: var(--ink-3); font-size: 13px; }
</style>
</head>
<body>

<div id="checking">Memeriksa akses…</div>

<div id="app-modul" class="hidden">
  <div id="topbar">
    <div class="brand">Ayo Belajar! <span>·</span> Kelas 5</div>
    <a class="back" href="../index.html">← Kembali ke Beranda</a>
  </div>

  <div class="container">
    <h1>🚀 Ayo Belajar!</h1>
    <p class="subtitle">Mulai dari sini — belajar mandiri interaktif per tujuan pembelajaran, langkah demi langkah. Pilih mata pelajaran, lalu ketuk judul untuk mulai.</p>

    <div id="filter-row" class="filter-row"></div>
    <div id="list-modul"><div class="empty-state">Memuat modul…</div></div>
  </div>
</div>

<script src="modul/assets/modul-index.js"></script>
<script type="module" src="../assets/js/role-guard.js"></script>
<script type="module">
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

  const app = getApps()[0];
  const db = getFirestore(app);

  // Peta warna & ikon default per mapel, dipakai sebagai fallback untuk
  // entri Firestore (link eksternal dari admin) yang tidak menyertakan
  // mapelColor/mapelIcon sendiri — supaya tetap konsisten dengan modul lokal.
  const MAPEL_META = {
    "Bahasa Indonesia": { color: "var(--m-bahasa-indonesia)", icon: "📝" },
    "Matematika": { color: "var(--m-matematika)", icon: "🔢" },
    "IPAS": { color: "var(--m-ipas)", icon: "🔬" },
    "Pendidikan Pancasila": { color: "var(--m-pancasila)", icon: "🏛" },
    "Seni Budaya": { color: "var(--m-seni-budaya)", icon: "🎨" },
    "PJOK": { color: "var(--m-pjok)", icon: "⚽" },
    "Bahasa Inggris": { color: "var(--m-bahasa-inggris)", icon: "🗣" },
    "Al-Islam": { color: "var(--m-pai)", icon: "📖" }
  };
  function metaFor(mapel) { return MAPEL_META[mapel] || { color: "var(--accent-3)", icon: "📚" }; }

  let allItems = [];
  let activeMapel = "Semua";
  const collapsedMapel = new Set();

  function esc(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function loadModul() {
    const wrap = document.getElementById("list-modul");

    // 1) Modul lokal interaktif, dari modul-index.js (sumber statis di repo).
    // Ini SELALU dirender terlebih dulu dan tidak bergantung pada Firestore —
    // supaya modul lokal tetap tampil walau langkah 2 di bawah gagal.
    const local = (window.MODUL_INDEX || []).map((it) => {
      const meta = metaFor(it.mapel);
      return {
        ...it,
        mapelColor: it.mapelColor || meta.color,
        mapelIcon: it.mapelIcon || meta.icon,
        source: "local",
        href: "modul/" + it.file
      };
    });

    // 2) Modul eksternal (link Drive/PDF dsb.) yang diisi guru lewat admin.
    // Dibungkus try/catch TERPISAH: kalau koleksi "modul" di Firestore belum
    // ada / aturan keamanan menolak baca / jaringan gagal, modul lokal di
    // atas tetap harus tampil — bukan malah ikut hilang.
    let external = [];
    try {
      const snap = await getDocs(collection(db, "modul"));
      snap.forEach((d) => {
        const data = d.data();
        const mapel = data.mapel || "(Tanpa Mapel)";
        const meta = metaFor(mapel);
        const urlOk = data.url_file && /^https?:\/\//.test(data.url_file);
        if (!urlOk) return; // lewati entri tanpa link valid
        external.push({
          mapel,
          mapelColor: meta.color,
          mapelIcon: meta.icon,
          tema: data.tema || "Lainnya",
          urutan: data.urutan || 0,
          judul: data.judul || "-",
          ringkasan: "",
          status: "selesai",
          source: "external",
          href: data.url_file
        });
      });
    } catch (err) {
      console.warn("Gagal memuat modul eksternal dari Firestore (modul lokal tetap ditampilkan):", err);
    }

    allItems = [...local, ...external];
    renderFilters();
    renderList();
  }

  function renderFilters() {
    const mapelList = ["Semua", ...new Set(allItems.map((it) => it.mapel))];
    const wrap = document.getElementById("filter-row");
    wrap.innerHTML = "";
    mapelList.forEach((m) => {
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (m === activeMapel ? " active" : "");
      chip.textContent = m;
      chip.onclick = () => { activeMapel = m; renderFilters(); renderList(); };
      wrap.appendChild(chip);
    });
  }

  function renderList() {
    const wrap = document.getElementById("list-modul");
    if (allItems.length === 0) {
      wrap.innerHTML = '<div class="empty-state">Belum ada modul yang ditambahkan. Modul baru akan muncul di sini.</div>';
      return;
    }
    const filtered = activeMapel === "Semua" ? allItems : allItems.filter((it) => it.mapel === activeMapel);
    if (filtered.length === 0) {
      wrap.innerHTML = '<div class="empty-state">Belum ada modul untuk mapel ini.</div>';
      return;
    }

    const grouped = {};
    filtered.forEach((it) => { (grouped[it.mapel] = grouped[it.mapel] || []).push(it); });

    wrap.innerHTML = "";
    Object.keys(grouped).sort().forEach((mapel) => {
      const items = grouped[mapel];
      const color = items[0].mapelColor;
      const icon = items[0].mapelIcon;
      const groupId = "grp-" + mapel.replace(/[^a-zA-Z0-9]/g, "-");
      const wasCollapsed = collapsedMapel.has(mapel);

      const title = document.createElement("div");
      title.className = "group-title" + (wasCollapsed ? " collapsed" : "");
      title.style.setProperty("--m-color", color);
      title.innerHTML = `<span class="dot"></span> ${esc(mapel)} <span class="count">(${items.length})</span><span class="chevron">▾</span>`;
      title.onclick = () => {
        if (collapsedMapel.has(mapel)) collapsedMapel.delete(mapel);
        else collapsedMapel.add(mapel);
        renderList();
      };
      wrap.appendChild(title);

      const body = document.createElement("div");
      body.className = "group-body" + (wasCollapsed ? " collapsed" : "");
      body.id = groupId;
      wrap.appendChild(body);

      const byTema = {};
      items.forEach((it) => { (byTema[it.tema || "Lainnya"] = byTema[it.tema || "Lainnya"] || []).push(it); });

      Object.keys(byTema).forEach((tema) => {
        byTema[tema].sort((a, b) => (a.urutan || 0) - (b.urutan || 0));

        const subTitle = document.createElement("div");
        subTitle.className = "subgroup-title";
        subTitle.style.setProperty("--m-color", color);
        subTitle.textContent = tema;
        body.appendChild(subTitle);

        byTema[tema].forEach((it) => {
          const card = document.createElement("a");
          card.className = "modul-card";
          card.style.setProperty("--m-color", color);
          card.href = it.href;
          if (it.source === "external") { card.target = "_blank"; card.rel = "noopener"; }
          card.innerHTML = `
            <div class="m-icon">${it.icon || icon}</div>
            <div class="m-body">
              <div class="m-title">${esc(it.judul)}
                <span class="m-badge${it.source === "local" ? " interaktif" : ""}">${it.source === "local" ? "🧩 Interaktif" : "🔗 Tautan"}</span>
                ${it.status === "segera" ? '<span style="font-weight:400;color:var(--ink-3);font-size:11px;">(segera hadir)</span>' : ""}
              </div>
              ${it.ringkasan ? `<div class="m-ringkasan">${esc(it.ringkasan)}</div>` : ""}
            </div>
            <div class="m-arrow">→</div>
          `;
          body.appendChild(card);
        });
      });
    });
  }

  document.addEventListener("role-verified", () => {
    document.getElementById("checking").remove();
    document.getElementById("app-modul").classList.remove("hidden");
    loadModul();
  });
  // v1.3: dibuka untuk orangtua juga (permintaan eksplisit Arif) — TIDAK berisiko
  // tracker EXP salah kirim, karena modul-progress-tracker.js di tiap file konten
  // SUDAH memfilter `data.role !== "siswa"` sebelum mengirim progres apa pun.
  document.addEventListener("DOMContentLoaded", () => window.guardRolePage(['siswa','guru','orangtua'], '../index.html'));
</script>
</body>
</html>
