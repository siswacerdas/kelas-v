<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingat Lagi · Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;650&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/design-system.css" />
<link rel="stylesheet" href="../assets/css/belajar-shell.css" />
<style>
  :root {
    --m-bahasa-indonesia: #8c3d5f;
    --m-matematika:       #1f6f78;
    --m-ipas:             #3f7d4a;
    --m-pai:              #0f6b52;
    --m-pancasila:        #a13d3d;
    --m-seni-budaya:      #c9861f;
    --m-pjok:             #d9541c;
    --m-bahasa-inggris:   #4a5d8c;
    --step-accent:        #e8a020;
  }

  #checking {
    padding: 4rem 1.5rem;
    text-align: center;
    color: var(--ink-3);
    font-size: 14px;
  }

  #topbar { border-bottom-color: var(--step-accent); }
  #topbar .brand span { color: var(--step-accent); }
  #topbar a.back {
    color: rgba(255, 255, 255, 0.75);
    font-size: 12.5px;
    text-decoration: none;
    font-weight: 500;
  }
  #topbar a.back:hover { color: #fff; }

  .bl-welcome {
    background: linear-gradient(180deg, #fdf6e8 0%, var(--paper) 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem var(--s-5) 1.35rem;
  }
  .bl-welcome-inner {
    max-width: var(--content-max);
    margin: 0 auto;
  }
  .bl-step-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0.45rem;
  }
  .bl-step-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: var(--step-accent);
    padding: 4px 11px;
    border-radius: var(--r-full);
  }
  .bl-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .bl-title {
    font-family: var(--font-display);
    font-size: clamp(1.45rem, 4vw, 1.9rem);
    font-weight: 700;
    color: var(--ink);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .bl-sub {
    margin-top: 0.4rem;
    font-size: 13.5px;
    color: var(--ink-3);
    max-width: 40em;
    line-height: 1.55;
  }

  .bl-container {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: var(--s-6) var(--s-4) var(--s-10);
  }

  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.35rem;
  }
  .filter-chip {
    padding: 7px 14px;
    border-radius: var(--r-full);
    font-size: 12.5px;
    font-weight: 600;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-2);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .filter-chip:hover {
    border-color: var(--border-2);
    box-shadow: var(--shadow-sm);
  }
  .filter-chip.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .group-title {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 1.65rem 0 0.75rem;
    padding: 0.55rem 0.15rem;
    border-bottom: 1px solid var(--border);
  }
  .group-title:first-child { margin-top: 0.25rem; }
  .group-title .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--m-color, var(--step-accent));
    flex-shrink: 0;
  }
  .group-title .count {
    font-weight: 500;
    color: var(--ink-3);
    font-size: 12px;
  }
  .group-title .chevron {
    margin-left: auto;
    font-size: 11px;
    color: var(--ink-3);
    transition: transform 0.15s;
  }
  .group-title.collapsed .chevron { transform: rotate(-90deg); }
  .group-body { display: block; }
  .group-body.collapsed { display: none; }

  .subgroup-title {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--m-color, var(--ink-3));
    margin: 1rem 0 0.55rem 2px;
  }

  .materi-card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 1rem 1.05rem;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .materi-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--m-color, var(--step-accent));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.22s ease;
  }
  .materi-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--border-2);
  }
  .materi-card:hover::after { transform: scaleX(1); }
  .materi-card:active { transform: translateY(-1px); }

  .materi-card .m-icon {
    font-size: 1.45rem;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .materi-card .m-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .materi-card .m-title {
    font-weight: 650;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 1.35;
  }
  .materi-card .m-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
  }
  .materi-card .m-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 9px;
    border-radius: var(--r-full);
    background: var(--paper-2);
    color: var(--ink-3);
  }
  .materi-card .m-badge.segera {
    background: rgba(232, 160, 32, 0.14);
    color: #8a5a00;
  }
  .materi-card .m-arrow {
    flex-shrink: 0;
    color: var(--ink-3);
    font-size: 15px;
    margin-top: 4px;
    transition: color 0.15s, transform 0.15s;
  }
  .materi-card:hover .m-arrow {
    color: var(--m-color, var(--step-accent));
    transform: translateX(2px);
  }

  .empty-state {
    padding: 2.25rem 1.25rem;
    text-align: center;
    color: var(--ink-3);
    font-size: 13.5px;
    background: var(--paper-2);
    border-radius: var(--r-lg);
    border: 1px dashed var(--border);
  }

  @media (max-width: 480px) {
    .bl-welcome { padding: 1.25rem var(--s-4) 1.15rem; }
    .bl-container { padding: var(--s-5) var(--s-3) var(--s-8); }
    .materi-card { padding: 0.9rem 0.95rem; gap: 12px; }
    .materi-card .m-title { font-size: 13.5px; }
  }
</style>
</head>
<body class="bl-has-shell" data-belajar-step="2">

<div id="checking">Memeriksa akses…</div>

<div id="app-materi" class="hidden">
  <div id="topbar">
    <div class="brand">Ingat Lagi <span>·</span> Kelas 5</div>
    <a class="back" href="../index.html">← Kembali ke Beranda</a>
  </div>

  <div class="bl-welcome">
    <div class="bl-welcome-inner">
      <div class="bl-step-row">
        <span class="bl-step-pill">Langkah 2</span>
        <span class="bl-eyebrow">Jalur Belajar</span>
      </div>
      <h1 class="bl-title">🔁 Ingat Lagi</h1>
      <p class="bl-sub">Sudah belajar dari Ayo Belajar!? Baca ulang di sini biar makin ingat — pilih mata pelajaran, lalu ketuk judul.</p>
    </div>
  </div>

  <div class="bl-container">
    <div class="filter-row" id="filter-row"></div>
    <div id="list-materi"><div class="empty-state">Memuat materi…</div></div>
  </div>
</div>

<script src="../assets/js/belajar-shell.js"></script>
<script type="module" src="../assets/js/role-guard.js"></script>
<script src="materi/assets/materi-index.js"></script>
<script>
  const allItems = window.MATERI_INDEX || [];
  let activeMapel = "Semua";
  const collapsedMapel = new Set();

  function esc(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&" + "amp;",
      "<": "&" + "lt;",
      ">": "&" + "gt;",
      '"': "&" + "quot;",
      "'": "&#39;"
    }[c]));
  }

  function renderFilters() {
    const mapelList = ["Semua", ...new Set(allItems.map((it) => it.mapel))];
    const wrap = document.getElementById("filter-row");
    wrap.innerHTML = "";
    mapelList.forEach((m) => {
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (m === activeMapel ? " active" : "");
      chip.textContent = m;
      chip.onclick = () => { activeMapel = m; renderFilters(); renderList(); };
      wrap.appendChild(chip);
    });
  }

  function renderList() {
    const wrap = document.getElementById("list-materi");
    if (allItems.length === 0) {
      wrap.innerHTML = '<div class="empty-state">Belum ada materi yang ditambahkan. Materi baru akan muncul di sini.</div>';
      return;
    }
    const filtered = activeMapel === "Semua" ? allItems : allItems.filter((it) => it.mapel === activeMapel);
    if (filtered.length === 0) {
      wrap.innerHTML = '<div class="empty-state">Belum ada materi untuk mapel ini.</div>';
      return;
    }
    const grouped = {};
    filtered.forEach((it) => { (grouped[it.mapel] = grouped[it.mapel] || []).push(it); });

    wrap.innerHTML = "";
    Object.keys(grouped).sort().forEach((mapel) => {
      const items = grouped[mapel];
      const color = items[0].mapelColor || "var(--step-accent)";
      const icon = items[0].mapelIcon || "📖";
      const groupId = "grp-" + mapel.replace(/[^a-zA-Z0-9]/g, "-");
      const wasCollapsed = collapsedMapel.has(mapel);

      const title = document.createElement("div");
      title.className = "group-title" + (wasCollapsed ? " collapsed" : "");
      title.style.setProperty("--m-color", color);
      title.innerHTML = `<span class="dot"></span> ${esc(mapel)} <span class="count">(${items.length})</span><span class="chevron">▾</span>`;
      title.onclick = () => {
        if (collapsedMapel.has(mapel)) collapsedMapel.delete(mapel);
        else collapsedMapel.add(mapel);
        renderList();
      };
      wrap.appendChild(title);

      const body = document.createElement("div");
      body.className = "group-body" + (wasCollapsed ? " collapsed" : "");
      body.id = groupId;
      wrap.appendChild(body);

      const byTema = {};
      items.forEach((it) => { (byTema[it.tema || "Lainnya"] = byTema[it.tema || "Lainnya"] || []).push(it); });

      Object.keys(byTema).forEach((tema) => {
        byTema[tema].sort((a, b) => (a.urutan || 0) - (b.urutan || 0));

        const subTitle = document.createElement("div");
        subTitle.className = "subgroup-title";
        subTitle.style.setProperty("--m-color", color);
        subTitle.textContent = tema;
        body.appendChild(subTitle);

        byTema[tema].forEach((it) => {
          const card = document.createElement("a");
          card.className = "materi-card";
          card.style.setProperty("--m-color", color);
          card.href = "materi/" + it.file;

          const badges = [];
          if (it.status === "segera") {
            badges.push('<span class="m-badge segera">Segera hadir</span>');
          }

          card.innerHTML = `
            <div class="m-icon">${it.icon || icon}</div>
            <div class="m-body">
              <div class="m-title">${esc(it.judul)}</div>
              ${badges.length ? `<div class="m-meta">${badges.join("")}</div>` : ""}
            </div>
            <div class="m-arrow">→</div>
          `;
          body.appendChild(card);
        });
      });
    });
  }

  document.addEventListener("role-verified", () => {
    document.getElementById("checking").remove();
    document.getElementById("app-materi").classList.remove("hidden");
    renderFilters();
    renderList();
  });
  document.addEventListener("DOMContentLoaded", () => window.guardRolePage(['siswa','guru','orangtua'], '../index.html'));
</script>
</body>
</html>
