<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingat Lagi · Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;650&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/design-system.css" />
<link rel="stylesheet" href="../assets/css/belajar-shell.css" />
<style>
  :root {
    --m-bahasa-indonesia: #8c3d5f; --m-matematika: #1f6f78; --m-ipas: #3f7d4a; --m-pai: #0f6b52;
    --m-pancasila: #a13d3d; --m-seni-budaya: #c9861f; --m-pjok: #d9541c; --m-bahasa-inggris: #4a5d8c;
    --step-accent: #e8a020;
  }
  #checking { padding: 4rem 1.5rem; text-align: center; color: var(--ink-3); font-size: 14px; }
  #topbar { border-bottom-color: var(--step-accent); }
  #topbar .brand span { color: var(--step-accent); }
  #topbar a.back { color: rgba(255,255,255,0.75); font-size: 12.5px; text-decoration: none; font-weight: 500; }
  #topbar a.back:hover { color: #fff; }
  .bl-welcome { background: linear-gradient(180deg, #fdf6e8 0%, var(--paper) 100%); border-bottom: 1px solid var(--border); padding: 1.5rem var(--s-5) 1.35rem; }
  .bl-welcome-inner { max-width: var(--content-max); margin: 0 auto; }
  .bl-step-row { display: flex; align-items: center; gap: 10px; margin-bottom: 0.45rem; }
  .bl-step-pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; background: var(--step-accent); padding: 4px 11px; border-radius: var(--r-full); }
  .bl-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .bl-title { font-family: var(--font-display); font-size: clamp(1.45rem, 4vw, 1.9rem); font-weight: 700; color: var(--ink); line-height: 1.2; }
  .bl-sub { margin-top: 0.4rem; font-size: 13.5px; color: var(--ink-3); max-width: 40em; line-height: 1.55; }
  .bl-container { max-width: var(--content-max); margin: 0 auto; padding: var(--s-6) var(--s-4) var(--s-10); }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.35rem; }
  .filter-chip { padding: 7px 14px; border-radius: var(--r-full); font-size: 12.5px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); color: var(--ink-2); cursor: pointer; font-family: inherit; }
  .filter-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .subgroup-title { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--m-color, var(--ink-3)); margin: 1rem 0 0.55rem 2px; }
  .materi-card { display: flex; align-items: flex-start; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1rem 1.05rem; margin-bottom: 10px; text-decoration: none; color: inherit; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
  .materi-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--m-color, var(--step-accent)); transform: scaleX(0); transform-origin: left; transition: transform 0.22s ease; }
  .materi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-2); }
  .materi-card:hover::after { transform: scaleX(1); }
  .materi-card .m-icon { font-size: 1.45rem; line-height: 1; flex-shrink: 0; }
  .materi-card .m-body { flex: 1; min-width: 0; }
  .materi-card .m-title { font-weight: 650; font-size: 14px; color: var(--ink); line-height: 1.35; }
  .materi-card .m-arrow { flex-shrink: 0; color: var(--ink-3); font-size: 15px; }
  .empty-state { padding: 2.25rem 1.25rem; text-align: center; color: var(--ink-3); font-size: 13.5px; background: var(--paper-2); border-radius: var(--r-lg); border: 1px dashed var(--border); }
  .bl-hint { font-size: 13.5px; color: var(--ink-3); margin-bottom: 1rem; line-height: 1.5; }
  .bl-breadcrumb { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 0.85rem; }
  .bc-back { font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; }
  .bc-back:hover { text-decoration: underline; }
  .bc-current { font-size: 13px; font-weight: 650; color: var(--ink); }
  .elemen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .elemen-card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 1.1rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); cursor: pointer; font-family: inherit; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
  .elemen-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-2); }
  .elemen-card .el-icon { font-size: 1.5rem; line-height: 1; }
  .elemen-card .el-name { font-size: 13.5px; font-weight: 650; color: var(--ink); line-height: 1.35; }
  .elemen-card .el-count { font-size: 12px; color: var(--ink-3); font-weight: 500; }
  @media (max-width: 480px) { .elemen-grid { grid-template-columns: 1fr 1fr; gap: 10px; } }
</style>
</head>
<body class="bl-has-shell" data-belajar-step="2">

<div id="checking">Memeriksa akses…</div>

<div id="app-materi" class="hidden">
  <div id="topbar">
    <div class="brand">Ingat Lagi <span>·</span> Kelas 5</div>
    <a class="back" href="../index.html">← Kembali ke Beranda</a>
  </div>
  <div class="bl-welcome">
    <div class="bl-welcome-inner">
      <div class="bl-step-row">
        <span class="bl-step-pill">Langkah 2</span>
        <span class="bl-eyebrow">Jalur Belajar</span>
      </div>
      <h1 class="bl-title">🔁 Ingat Lagi</h1>
      <p class="bl-sub">Pilih mapel, lalu elemen — baru muncul materi. Satu langkah demi satu langkah, biar tidak bingung.</p>
    </div>
  </div>
  <div class="bl-container">
    <div class="filter-row bl-sticky-filters" id="filter-row"></div>
    <div id="list-materi"><div class="empty-state">Memuat materi…</div></div>
  </div>
</div>

<script src="../assets/js/belajar-shell.js"></script>
<script type="module" src="../assets/js/role-guard.js"></script>
<script src="materi/assets/materi-index.js"></script>
<script>
  const allItems = window.MATERI_INDEX || [];
  let activeMapel = "Semua";
  let activeElemen = null;

  function esc(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&" + "amp;", "<": "&" + "lt;", ">": "&" + "gt;",
      '"': "&" + "quot;", "'": "&#39;"
    }[c]));
  }
  function itemsForMapel(mapel) { return allItems.filter((it) => it.mapel === mapel); }
  function elemenList(mapel) {
    const counts = {}, icons = {};
    itemsForMapel(mapel).forEach((it) => {
      const el = it.elemen || "Lainnya";
      counts[el] = (counts[el] || 0) + 1;
      if (!icons[el] && (it.icon || it.mapelIcon)) icons[el] = it.icon || it.mapelIcon;
    });
    return Object.keys(counts).sort().map((name) => ({ name, count: counts[name], icon: icons[name] || "📌" }));
  }
  function setMapel(m) { activeMapel = m; activeElemen = null; renderFilters(); renderList(); }
  function setElemen(el) { activeElemen = el; renderList(); renderElemenNav(); }

  function renderFilters() {
    const counts = {};
    allItems.forEach((it) => { counts[it.mapel] = (counts[it.mapel] || 0) + 1; });
    const mapelNames = Object.keys(counts).sort();
    const wrap = document.getElementById("filter-row");
    wrap.innerHTML = "";
    ["Semua", ...mapelNames].forEach((m) => {
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (m === activeMapel ? " active" : "");
      chip.textContent = m;
      chip.onclick = () => setMapel(m);
      wrap.appendChild(chip);
    });
    if (typeof window.belajarShellRenderMapel === "function") {
      window.belajarShellRenderMapel(
        [{ name: "Semua", count: allItems.length }, ...mapelNames.map((n) => ({ name: n, count: counts[n] }))],
        activeMapel, setMapel
      );
    }
    renderElemenNav();
  }

  function renderElemenNav() {
    if (typeof window.belajarShellRenderItems !== "function") return;
    if (activeMapel === "Semua") {
      if (typeof window.belajarShellClearItems === "function") window.belajarShellClearItems();
      return;
    }
    const list = elemenList(activeMapel);
    window.belajarShellRenderItems(
      list.map((e) => ({ id: e.name, label: e.name + " (" + e.count + ")" })),
      (id) => setElemen(id), "Elemen"
    );
    if (activeElemen) {
      const nav = document.getElementById("bl-item-nav");
      if (nav) nav.querySelectorAll(".bl-item-link").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-item-id") === activeElemen);
      });
    }
  }

  function renderList() {
    const wrap = document.getElementById("list-materi");
    if (allItems.length === 0) {
      wrap.innerHTML = '<div class="empty-state">Belum ada materi yang ditambahkan.</div>';
      return;
    }
    if (activeMapel === "Semua") {
      wrap.innerHTML = '<p class="bl-hint">Pilih mata pelajaran dulu — biar daftarnya tidak terlalu banyak.</p>';
      const grid = document.createElement("div");
      grid.className = "elemen-grid";
      const counts = {};
      allItems.forEach((it) => { counts[it.mapel] = (counts[it.mapel] || 0) + 1; });
      Object.keys(counts).sort().forEach((m) => {
        const sample = allItems.find((it) => it.mapel === m);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "elemen-card";
        btn.innerHTML = `<span class="el-icon">${sample.mapelIcon || "📚"}</span><span class="el-name">${esc(m)}</span><span class="el-count">${counts[m]} materi</span>`;
        btn.onclick = () => setMapel(m);
        grid.appendChild(btn);
      });
      wrap.appendChild(grid);
      return;
    }
    if (!activeElemen) {
      const els = elemenList(activeMapel);
      wrap.innerHTML = `<div class="bl-breadcrumb"><button type="button" class="bc-back" id="bc-mapel">← Semua mapel</button><span class="bc-current">${esc(activeMapel)}</span></div><p class="bl-hint">Pilih elemen — satu kelompok saja, biar lebih mudah fokus.</p>`;
      document.getElementById("bc-mapel").onclick = () => setMapel("Semua");
      const grid = document.createElement("div");
      grid.className = "elemen-grid";
      els.forEach((e) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "elemen-card";
        btn.innerHTML = `<span class="el-icon">${e.icon}</span><span class="el-name">${esc(e.name)}</span><span class="el-count">${e.count} materi</span>`;
        btn.onclick = () => setElemen(e.name);
        grid.appendChild(btn);
      });
      wrap.appendChild(grid);
      return;
    }
    const filtered = itemsForMapel(activeMapel).filter((it) => (it.elemen || "Lainnya") === activeElemen);
    const color = (filtered[0] && filtered[0].mapelColor) || "var(--step-accent)";
    const icon = (filtered[0] && (filtered[0].mapelIcon || filtered[0].icon)) || "📖";
    wrap.innerHTML = `<div class="bl-breadcrumb"><button type="button" class="bc-back" id="bc-elemen">← ${esc(activeMapel)}</button><span class="bc-current">${esc(activeElemen)}</span></div>`;
    document.getElementById("bc-elemen").onclick = () => setElemen(null);
    if (filtered.length === 0) {
      wrap.innerHTML += '<div class="empty-state">Belum ada materi di elemen ini.</div>';
      return;
    }
    const byTema = {};
    filtered.forEach((it) => { (byTema[it.tema || activeElemen] = byTema[it.tema || activeElemen] || []).push(it); });
    Object.keys(byTema).forEach((tema) => {
      byTema[tema].sort((a, b) => (a.urutan || 0) - (b.urutan || 0));
      if (Object.keys(byTema).length > 1 || tema !== activeElemen) {
        const sub = document.createElement("div");
        sub.className = "subgroup-title";
        sub.style.setProperty("--m-color", color);
        sub.textContent = tema;
        wrap.appendChild(sub);
      }
      byTema[tema].forEach((it) => {
        const card = document.createElement("a");
        card.className = "materi-card";
        card.style.setProperty("--m-color", color);
        card.href = "materi/" + it.file;
        card.innerHTML = `<div class="m-icon">${it.icon || icon}</div><div class="m-body"><div class="m-title">${esc(it.judul)}</div></div><div class="m-arrow">→</div>`;
        wrap.appendChild(card);
      });
    });
  }

  document.addEventListener("role-verified", () => {
    document.getElementById("checking").remove();
    document.getElementById("app-materi").classList.remove("hidden");
    renderFilters();
    renderList();
  });
  document.addEventListener("DOMContentLoaded", () => window.guardRolePage(['siswa','guru','orangtua'], '../index.html'));
</script>
</body>
</html>
