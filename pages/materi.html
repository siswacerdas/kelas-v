<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Materi Ajar · Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="materi/assets/materi.css" />
<style>
  .ma-page-container { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .ma-page-container h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 0.25rem; }
  .ma-subtitle { font-size: 13px; color: var(--ink-3); margin-bottom: 1.5rem; }
</style>
</head>
<body class="ma-root">

<div id="checking">Memeriksa akses…</div>

<div id="app-materi" class="ma-hidden">
  <div class="ma-topbar">
    <div class="ma-brand">Materi Ajar <span>·</span> Kelas 5</div>
    <a class="ma-back" href="../index.html">← Kembali ke Beranda</a>
  </div>

  <div class="ma-page-container">
    <h1>📖 Materi Ajar</h1>
    <p class="ma-subtitle">Buku Belajar Mandiri — pilih mata pelajaran, lalu ketuk judul untuk membaca materinya.</p>

    <div id="filter-row" class="ma-filter-row"></div>
    <div id="list-materi"><div class="ma-empty">Memuat materi…</div></div>
  </div>
</div>

<script type="module" src="../assets/js/auth-guard.js"></script>
<script src="materi/assets/materi-index.js"></script>
<script>
  const allItems = window.MATERI_INDEX || [];
  let activeMapel = "Semua";

  function esc(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderFilters() {
    const mapelList = ["Semua", ...new Set(allItems.map((it) => it.mapel))];
    const wrap = document.getElementById("filter-row");
    wrap.innerHTML = "";
    mapelList.forEach((m) => {
      const chip = document.createElement("button");
      chip.className = "ma-filter-chip" + (m === activeMapel ? " ma-active" : "");
      chip.textContent = m;
      chip.onclick = () => { activeMapel = m; renderFilters(); renderList(); };
      wrap.appendChild(chip);
    });
  }

  function renderList() {
    const wrap = document.getElementById("list-materi");
    if (allItems.length === 0) {
      wrap.innerHTML = '<div class="ma-empty">Belum ada materi yang ditambahkan. Materi baru akan muncul di sini.</div>';
      return;
    }
    const filtered = activeMapel === "Semua" ? allItems : allItems.filter((it) => it.mapel === activeMapel);
    if (filtered.length === 0) {
      wrap.innerHTML = '<div class="ma-empty">Belum ada materi untuk mapel ini.</div>';
      return;
    }
    const grouped = {};
    filtered.forEach((it) => { (grouped[it.mapel] = grouped[it.mapel] || []).push(it); });
    Object.keys(grouped).forEach((k) => grouped[k].sort((a, b) => (a.urutan || 0) - (b.urutan || 0)));

    wrap.innerHTML = "";
    Object.keys(grouped).sort().forEach((mapel) => {
      const items = grouped[mapel];
      const color = items[0].mapelColor || "var(--accent-2)";
      const icon = items[0].mapelIcon || "📖";

      const title = document.createElement("div");
      title.className = "ma-group-title";
      title.innerHTML = `<span class="ma-dot" style="--m-color:${color}"></span> ${esc(mapel)}`;
      wrap.appendChild(title);

      // Sub-kelompok per tema — nanti diganti per TP/CP begitu
      // dokumen resminya ada (lihat catatan field "tp" di materi-index.js)
      const byTema = {};
      items.forEach((it) => { (byTema[it.tema || "Lainnya"] = byTema[it.tema || "Lainnya"] || []).push(it); });

      Object.keys(byTema).forEach((tema) => {
        const subTitle = document.createElement("div");
        subTitle.className = "ma-subgroup-title";
        subTitle.style.setProperty("--m-color", color);
        subTitle.textContent = tema;
        wrap.appendChild(subTitle);

        byTema[tema].forEach((it) => {
          const card = document.createElement("a");
          card.className = "ma-list-card";
          card.style.setProperty("--m-color", color);
          card.href = "materi/" + it.file;
          card.innerHTML = `
            <div class="ma-list-icon">${icon}</div>
            <div><div class="ma-list-title">${esc(it.judul)}</div></div>
            <div class="ma-list-arrow">→</div>
          `;
          wrap.appendChild(card);
        });
      });
    });
  }

  document.addEventListener("user-verified", () => {
    document.getElementById("checking").remove();
    document.getElementById("app-materi").classList.remove("ma-hidden");
    renderFilters();
    renderList();
  });
  document.addEventListener("DOMContentLoaded", () => window.guardLoggedInPage("../index.html"));
</script>
</body>
</html>
