<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Linimasa Materi · Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a2e; --ink-2: #3d3d5c; --ink-3: #7b7b9a;
    --paper: #faf9f6; --paper-2: #f0eee8; --paper-3: #e2dfd6;
    --teal: #1a7a8a; --teal-l: #e4f2f4; --border: rgba(26,26,46,0.10); --r: 10px;
    --gold: #b8860b; --gold-l: #fdf6e3; --red: #c0392b; --red-l: #fbeaea; --green: #2d7055; --green-l: #e6f2ec;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
  #topbar {
    position: sticky; top: 0; z-index: 100; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.5rem; height: 52px; border-bottom: 2px solid var(--teal);
  }
  #topbar .brand { font-family: 'Playfair Display', serif; font-size: 1.05rem; }
  #topbar .brand span { color: var(--teal); }
  #topbar a.back { color: rgba(255,255,255,0.75); font-size: 12px; text-decoration: none; }
  #topbar a.back:hover { color: #fff; }
  .container { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 0.25rem; }
  .subtitle { font-size: 13px; color: var(--ink-3); margin-bottom: 1.1rem; line-height: 1.6; }
  #checking { padding: 4rem 1.5rem; text-align: center; color: var(--ink-3); font-size: 14px; }
  .hidden { display: none !important; }

  /* ── Legenda status ── */
  .legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--ink-3); margin-bottom: 1.1rem; }
  .legenda span { display: inline-flex; align-items: center; gap: 5px; }

  /* ── Bar navigasi lompat-ke-bulan ── */
  .nav-label { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-bottom: 6px; }
  .bulan-nav {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 1.1rem;
    scrollbar-width: thin; -webkit-overflow-scrolling: touch;
  }
  .bulan-nav::-webkit-scrollbar { height: 4px; }
  .bulan-nav::-webkit-scrollbar-thumb { background: var(--paper-3); border-radius: 4px; }
  .bulan-nav button {
    flex-shrink: 0; font-family: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
    padding: 6px 11px; border-radius: 8px; border: 1.5px solid var(--border);
    background: #fff; color: var(--ink-2); white-space: nowrap; transition: all .15s;
  }
  .bulan-nav button:hover { border-color: var(--teal); }
  .bulan-nav button.nav-sekarang { border-color: var(--teal); color: var(--teal); background: var(--teal-l); }
  .bulan-nav .nav-sep { flex-shrink: 0; width: 1px; background: var(--border); margin: 2px 2px; }

  /* ── Chip filter mapel & status ── */
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.7rem; }
  .chip-row:last-of-type { margin-bottom: 1.4rem; }
  .chip {
    font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    padding: 6px 13px; border-radius: 20px; border: 1.5px solid var(--border);
    background: #fff; color: var(--ink-2); white-space: nowrap; transition: all .15s;
  }
  .chip:hover { border-color: var(--teal); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  h2.semester-title {
    font-family: 'Playfair Display', serif; font-size: 1.15rem; margin: 1.6rem 0 0.15rem;
    display: flex; align-items: baseline; gap: 8px;
  }
  h2.semester-title:first-of-type { margin-top: 0; }
  h2.semester-title .sem-tahun { font-size: 12px; font-weight: 500; color: var(--ink-3); font-family: 'Plus Jakarta Sans', sans-serif; }
  .semester-ringkasan { font-size: 11.5px; color: var(--ink-3); margin-bottom: 0.8rem; }
  .semester-kosong-filter { font-size: 12px; color: var(--ink-3); font-style: italic; padding: 0.5rem 0 1rem; }

  /* ── Accordion bulan ── */
  details.bulan-block {
    background: #fff; border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 8px; overflow: hidden;
    scroll-margin-top: 64px;
  }
  details.bulan-block.sorot { animation: sorotBulan 1.6s ease; }
  @keyframes sorotBulan {
    0% { box-shadow: 0 0 0 3px var(--teal); }
    100% { box-shadow: none; }
  }
  details.bulan-block[data-status="berjalan"] { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal-l); }
  details.bulan-block > summary {
    list-style: none; cursor: pointer; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 13.5px; user-select: none;
  }
  details.bulan-block > summary::-webkit-details-marker { display: none; }
  details.bulan-block > summary::before { content: '▸'; color: var(--teal); font-size: 12px; transition: transform .15s; flex-shrink: 0; }
  details.bulan-block[open] > summary::before { transform: rotate(90deg); }
  details.bulan-block > summary .status-pill {
    margin-left: auto; font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 20px; white-space: nowrap;
  }
  .status-pill.selesai { background: var(--green-l); color: var(--green); }
  .status-pill.berjalan { background: var(--teal-l); color: var(--teal); }
  .status-pill.akan { background: var(--paper-2); color: var(--ink-3); }
  .status-pill.kosong { background: var(--paper-2); color: var(--ink-3); }

  .bulan-body { padding: 0 1rem 1rem 2.1rem; }
  .entri-row { padding: 8px 0; border-top: 1px solid var(--paper-2); }
  .entri-row:first-child { border-top: none; }
  .entri-head { display: flex; align-items: baseline; gap: 7px; font-size: 12.5px; }
  .entri-icon { flex-shrink: 0; }
  .entri-mapel { font-weight: 700; color: var(--ink); }
  .entri-topik { color: var(--ink-2); }
  .entri-ket { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; padding-left: 20px; line-height: 1.5; }
  .bulan-kosong { font-size: 12px; color: var(--ink-3); font-style: italic; padding: 4px 0; }

  .loading-inline { text-align: center; color: var(--ink-3); font-size: 13px; padding: 2rem 0; }
  .empty-global { text-align: center; color: var(--ink-3); font-size: 13px; padding: 2.5rem 1rem; }

  /* ── Tombol mengambang "Bulan Ini" ── */
  #btnBulanIni {
    position: fixed; bottom: 20px; right: 20px; z-index: 90;
    display: none; align-items: center; gap: 6px;
    font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    background: var(--ink); color: #fff; border: none; padding: 10px 16px 10px 14px;
    border-radius: 30px; box-shadow: 0 4px 16px rgba(26,26,46,0.28);
  }
  #btnBulanIni:active { transform: scale(0.97); }
</style>
</head>
<body>

<div id="checking">Memuat…</div>

<div id="app-linimasa" class="hidden">
  <div id="topbar">
    <div class="brand">🗓️ Linimasa Materi <span>·</span> Kelas 5</div>
    <a class="back" href="../index.html">← Kembali ke Beranda</a>
  </div>

  <div class="container">
    <h1>🗓️ Linimasa Materi</h1>
    <p class="subtitle">Rencana & perjalanan belajar per mata pelajaran, bulan demi bulan — biar siswa & orang tua bisa menyiapkan diri sebelum asesmen.</p>

    <div class="legenda">
      <span>✅ Sudah selesai</span>
      <span>🔵 Sedang berjalan</span>
      <span>⚪ Akan datang</span>
    </div>

    <div class="nav-label">Lompat ke bulan</div>
    <div class="bulan-nav" id="bulanNav"></div>

    <div class="chip-row" id="chipRow"></div>
    <div class="chip-row" id="statusRow"></div>

    <div id="hasil">
      <div class="loading-inline">Memuat linimasa…</div>
    </div>
  </div>
</div>

<button id="btnBulanIni" type="button">🔵 Bulan Ini</button>

<script src="mpls/assets/config.js"></script>
<script src="../assets/js/mapel-list.js"></script>
<script type="module" src="../assets/js/role-guard.js"></script>
<script>
  const BULAN_NAMA = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni",
    "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  // Urutan tampil linimasa mengikuti TAHUN AJARAN (mulai Juli), BUKAN urutan kalender
  // Masehi (mulai Januari) — Semester 1 = Juli-Desember, Semester 2 = Januari-Juni.
  const SEM1_BULAN = [7, 8, 9, 10, 11, 12];
  const SEM2_BULAN = [1, 2, 3, 4, 5, 6];

  const now = new Date();
  const nowBulan = now.getMonth() + 1;
  const nowTahun = now.getFullYear();
  const nowYM = nowTahun * 12 + nowBulan;
  // Tahun ajaran berjalan dimulai Juli — kalau sekarang Jan-Jun, berarti sedang di
  // Semester 2 dari tahun ajaran yang MULAI tahun sebelumnya.
  const tahunAjaranMulai = nowBulan >= 7 ? nowTahun : nowTahun - 1;

  const LABEL_BULAN_PENDEK = ["", "Jan", "Feb", "Mar", "Apr", "Mei", "Jun",
    "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
  const STATUS_FILTER_LIST = [
    { key: "", label: "Semua status" },
    { key: "selesai", label: "✅ Selesai" },
    { key: "berjalan", label: "🔵 Berjalan" },
    { key: "akan", label: "⚪ Akan datang" },
  ];

  let semuaData = [];    // hasil fetch mentah dari Apps Script
  let mapelAktif = "";   // "" = Semua
  let statusAktif = "";  // "" = Semua status ("selesai"/"berjalan"/"akan")
  let observerBulanIni = null; // IntersectionObserver untuk tombol mengambang "Bulan Ini"

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function mapelInfo(nama) {
    return (window.DAFTAR_MAPEL || []).find((m) => m.mapel === nama) || { mapel: nama, mapelIcon: "📘" };
  }

  function renderChip() {
    const wrap = document.getElementById("chipRow");
    const daftar = window.DAFTAR_MAPEL || [];
    wrap.innerHTML = `<button class="chip ${mapelAktif === "" ? "active" : ""}" data-mapel="">Semua</button>` +
      daftar.map((m) => `<button class="chip ${mapelAktif === m.mapel ? "active" : ""}" data-mapel="${esc(m.mapel)}">${m.mapelIcon} ${esc(m.mapel)}</button>`).join("");
    wrap.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        mapelAktif = btn.getAttribute("data-mapel");
        renderChip();
        renderSemuaSemester();
      });
    });
  }

  /** Filter status TERPISAH dari filter mapel di atas — mempersempit bulan mana saja yang
   * ditampilkan berdasarkan status agregatnya (pakai pillClass yang sama dengan status-pill
   * di summary <details>, lihat hitungStatusBulan()). "kosong" (belum ada rencana) SENGAJA
   * tidak dijadikan pilihan filter karena bukan itu yang biasanya dicari siswa/orangtua. */
  function renderStatusChip() {
    const wrap = document.getElementById("statusRow");
    wrap.innerHTML = STATUS_FILTER_LIST.map((s) =>
      `<button class="chip ${statusAktif === s.key ? "active" : ""}" data-status="${s.key}">${s.label}</button>`).join("");
    wrap.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        statusAktif = btn.getAttribute("data-status");
        renderStatusChip();
        renderSemuaSemester();
      });
    });
  }

  /** Bar horizontal 12 bulan (urutan tahun ajaran) untuk lompat cepat ke accordion bulan
   * tertentu tanpa scroll manual — kepakai terutama di HP saat linimasa sudah panjang berisi
   * banyak bulan. Bulan berjalan (nowBulan) ditandai beda supaya gampang dikenali. */
  function renderBulanNav() {
    const wrap = document.getElementById("bulanNav");
    const urutan = [...SEM1_BULAN, ...SEM2_BULAN];
    wrap.innerHTML = urutan.map((b, i) => {
      const sekarang = b === nowBulan;
      const sep = i === SEM1_BULAN.length ? '<span class="nav-sep"></span>' : "";
      return `${sep}<button type="button" data-bulan="${b}" class="${sekarang ? "nav-sekarang" : ""}">${LABEL_BULAN_PENDEK[b]}</button>`;
    }).join("");
    wrap.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => lompatKeBulan(Number(btn.getAttribute("data-bulan"))));
    });
  }

  /** Lompat & buka accordion bulan tertentu. Kalau bulannya sedang disembunyikan oleh filter
   * status aktif, filter status DIRESET dulu (supaya navigasi selalu berhasil — pengguna tidak
   * perlu sadar dulu bahwa itu tersembunyi karena filter) baru dicoba lagi sekali. */
  function lompatKeBulan(bulanNum) {
    const cariDanBuka = () => {
      const el = document.getElementById("bulan-" + bulanNum);
      if (!el) return false;
      el.setAttribute("open", "");
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      el.classList.add("sorot");
      setTimeout(() => el.classList.remove("sorot"), 1600);
      return true;
    };
    if (cariDanBuka()) return;
    statusAktif = "";
    renderStatusChip();
    renderSemuaSemester();
    requestAnimationFrame(cariDanBuka);
  }

  /** Pasang ulang IntersectionObserver tiap kali #hasil dirender ulang (elemen lama sudah
   * dibuang lewat innerHTML, observer lama jadi tidak berguna). Kalau accordion bulan berjalan
   * sedang tersembunyi oleh filter, tombol disembunyikan (tidak ada yang bisa dituju). */
  function setupObserverBulanIni() {
    const btn = document.getElementById("btnBulanIni");
    if (observerBulanIni) observerBulanIni.disconnect();
    const el = document.getElementById("bulan-" + nowBulan);
    if (!el) { btn.style.display = "none"; return; }
    observerBulanIni = new IntersectionObserver((entries) => {
      entries.forEach((entry) => { btn.style.display = entry.isIntersecting ? "none" : "flex"; });
    }, { rootMargin: "-56px 0px 0px 0px", threshold: 0 });
    observerBulanIni.observe(el);
  }
  document.getElementById("btnBulanIni").addEventListener("click", () => lompatKeBulan(nowBulan));

  /** Status dihitung dari perbandingan (Tahun,Bulan) entri vs bulan berjalan
   * SEKARANG (Date() nyata) — bukan dari field manapun di sheet, supaya guru
   * tidak perlu mengubah status manual tiap bulan berganti. */
  function statusEntri(tahun, bulan) {
    const ym = Number(tahun) * 12 + Number(bulan);
    if (ym < nowYM) return "selesai";
    if (ym === nowYM) return "berjalan";
    return "akan";
  }

  /** Hitung status agregat 1 bulan (dipakai bareng oleh renderBulanBlock, ringkasan semester,
   * DAN bar navigasi bulan) — dipecah dari renderBulanBlock supaya angka di ringkasan semester
   * selalu konsisten 1:1 dengan pill yang tampil di tiap accordion, tidak ada logika ganda yang
   * bisa berbeda hasil. Filter MAPEL ikut dipertimbangkan di sini (tampilan yang sedang aktif),
   * filter STATUS SENGAJA TIDAK — itu baru diterapkan belakangan di renderSemesterBlok(), untuk
   * memutuskan blok bulan mana yang ditampilkan sama sekali. */
  function hitungStatusBulan(bulanNum, tahunSlot) {
    const cocok = semuaData.filter((d) => Number(d["Bulan"]) === bulanNum && (!mapelAktif || d["Mapel"] === mapelAktif));
    // Kalau ada data beneran, pakai Tahun dari data itu (jaga-jaga guru input tahun
    // yang beda dari asumsi tahunSlot); kalau kosong, pakai tahunSlot hasil hitungan.
    const tahunTampil = cocok.length ? cocok[0]["Tahun"] : tahunSlot;
    const statusList = cocok.map((d) => statusEntri(d["Tahun"], d["Bulan"]));
    let pillLabel, pillClass;
    if (cocok.length === 0) {
      pillLabel = "Belum ada rencana"; pillClass = "kosong";
    } else if (statusList.includes("berjalan")) {
      pillLabel = "🔵 Berjalan"; pillClass = "berjalan";
    } else if (statusList.every((s) => s === "selesai")) {
      pillLabel = "✅ Selesai"; pillClass = "selesai";
    } else {
      pillLabel = "⚪ Akan datang"; pillClass = "akan";
    }
    return { cocok, tahunTampil, pillClass, pillLabel };
  }

  function renderBulanBlock(bulanNum, isBulanIni, info) {
    const { cocok, tahunTampil, pillClass, pillLabel } = info;
    const isiHtml = cocok.length === 0
      ? `<div class="bulan-kosong">Belum ada rencana materi untuk bulan ini.</div>`
      : cocok.map((d) => {
          const st = statusEntri(d["Tahun"], d["Bulan"]);
          const ikon = st === "selesai" ? "✅" : st === "berjalan" ? "🔵" : "⚪";
          const mi = mapelInfo(d["Mapel"]);
          return `
            <div class="entri-row">
              <div class="entri-head">
                <span class="entri-icon">${ikon}</span>
                <span class="entri-icon">${mi.mapelIcon}</span>
                <span class="entri-mapel">${esc(d["Mapel"])}</span>
                <span class="entri-topik">— ${esc(d["Topik"])}</span>
              </div>
              ${d["Keterangan"] ? `<div class="entri-ket">${esc(d["Keterangan"])}</div>` : ""}
            </div>`;
        }).join("");

    return `
      <details class="bulan-block" id="bulan-${bulanNum}" data-status="${pillClass}" ${isBulanIni ? "open" : ""}>
        <summary>${BULAN_NAMA[bulanNum]} ${tahunTampil}<span class="status-pill ${pillClass}">${pillLabel}</span></summary>
        <div class="bulan-body">${isiHtml}</div>
      </details>`;
  }

  /** Kalimat ringkas di atas tiap semester, mis. "4 selesai · 1 berjalan · 1 akan datang" —
   * dihitung dari pillClass per bulan (bukan per entri satu-satu), jadi 1 bulan = 1 hitungan
   * sama seperti yang dilihat orang di daftar accordion di bawahnya. */
  function ringkasanSemester(bulanList, tahunSlot) {
    const jumlah = { selesai: 0, berjalan: 0, akan: 0, kosong: 0 };
    bulanList.forEach((b) => { jumlah[hitungStatusBulan(b, tahunSlot).pillClass]++; });
    const bagian = [];
    if (jumlah.selesai) bagian.push(`${jumlah.selesai} selesai`);
    if (jumlah.berjalan) bagian.push(`${jumlah.berjalan} berjalan`);
    if (jumlah.akan) bagian.push(`${jumlah.akan} akan datang`);
    if (jumlah.kosong) bagian.push(`${jumlah.kosong} belum ada rencana`);
    return bagian.join(" · ") || "Belum ada rencana sama sekali.";
  }

  /** Daftar accordion 1 semester, DIPERSEMPIT oleh filter status aktif (kalau ada). Bulan yang
   * tidak cocok status-nya tidak dirender sama sekali (bukan ditampilkan kosong) — konsisten
   * dengan cara filter mapel bekerja di tempat lain: menyembunyikan yang tidak relevan. */
  function renderSemesterBlok(bulanList, tahunSlot) {
    const daftar = bulanList
      .map((b) => ({ b, info: hitungStatusBulan(b, tahunSlot) }))
      .filter(({ info }) => !statusAktif || info.pillClass === statusAktif);
    if (daftar.length === 0) {
      return `<div class="semester-kosong-filter">Tidak ada bulan dengan status ini di semester ini.</div>`;
    }
    return daftar.map(({ b, info }) => renderBulanBlock(b, b === nowBulan && tahunSlot === nowTahun, info)).join("");
  }

  function renderSemuaSemester() {
    const wrap = document.getElementById("hasil");
    wrap.innerHTML = `
      <h2 class="semester-title">Semester 1 · Juli–Desember <span class="sem-tahun">${tahunAjaranMulai}</span></h2>
      <div class="semester-ringkasan">${ringkasanSemester(SEM1_BULAN, tahunAjaranMulai)}</div>
      ${renderSemesterBlok(SEM1_BULAN, tahunAjaranMulai)}
      <h2 class="semester-title">Semester 2 · Januari–Juni <span class="sem-tahun">${tahunAjaranMulai + 1}</span></h2>
      <div class="semester-ringkasan">${ringkasanSemester(SEM2_BULAN, tahunAjaranMulai + 1)}</div>
      ${renderSemesterBlok(SEM2_BULAN, tahunAjaranMulai + 1)}`;
    setupObserverBulanIni();
  }

  async function muatLinimasa() {
    const wrap = document.getElementById("hasil");
    try {
      const res = await fetch(MPLS_CONFIG.APPS_SCRIPT_URL + "?linimasa=1");
      const json = await res.json();
      semuaData = json.data || [];
      renderBulanNav();
      renderChip();
      renderStatusChip();
      renderSemuaSemester();
    } catch (err) {
      wrap.innerHTML = `<div class="empty-global">Gagal memuat linimasa: ${esc(err.message)}</div>`;
    }
  }

  // Siswa, orangtua, DAN guru semua boleh lihat halaman ini (permintaan eksplisit
  // Arif — linimasa penting diketahui siswa & orang tua untuk persiapan asesmen).
  // Hanya guru yang bisa MENGISI datanya, lewat tab "Linimasa" di admin.html — halaman
  // ini sendiri read-only untuk semua role, termasuk guru.
  document.addEventListener("role-verified", () => {
    document.getElementById("checking").remove();
    document.getElementById("app-linimasa").classList.remove("hidden");
    muatLinimasa();
  });
  document.addEventListener("DOMContentLoaded", () => window.guardRolePage(['siswa', 'guru', 'orangtua'], '../index.html'));
</script>
</body>
</html>
