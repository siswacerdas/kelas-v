<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galeri Visual · Kelas 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="materi/assets/materi.css" />
<link rel="stylesheet" href="infografis/assets/infografis.css" />
<style>
  .ma-page-container { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .ma-page-container h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 0.25rem; }
  .ma-subtitle { font-size: 13px; color: var(--ink-3); margin-bottom: 0.25rem; }
</style>
</head>
<body class="ma-root">

<div id="checking">Memeriksa akses…</div>

<div id="app-infografis" class="ma-hidden">
  <div class="ma-topbar">
    <div class="ma-brand">Galeri Visual <span>·</span> Kelas 5</div>
    <a class="ma-back" href="../index.html">← Kembali ke Beranda</a>
  </div>

  <div class="ma-page-container">
    <h1>🖼️ Galeri Visual</h1>
    <p class="ma-subtitle">Gambar, poster, infografis & video singkat pendukung belajar — cocok untuk yang lebih mudah paham lewat gambar daripada teks panjang.</p>
    <p class="ma-subtitle" id="ig-status" style="margin-top:0.75rem"></p>

    <div class="ig-mapel-grid" id="ig-mapel-grid"></div>
  </div>
</div>

<script type="module" src="../assets/js/auth-guard.js"></script>
<script src="mpls/assets/config.js"></script>
<script src="infografis/assets/infografis-data.js"></script>
<script>
  const grid = document.getElementById("ig-mapel-grid");
  const statusEl = document.getElementById("ig-status");

  function slugClass(slug) { return "ma-mapel-" + slug; }

  function renderGrid(countBySlug) {
    grid.innerHTML = window.INFOGRAFIS_MAPEL.map((m) => {
      const count = countBySlug[m.mapelSlug] || 0;
      return `
        <a class="ig-mapel-card ${slugClass(m.mapelSlug)}" href="infografis/galeri.html?mapel=${encodeURIComponent(m.mapelSlug)}">
          <span class="ig-mapel-icon">${m.mapelIcon}</span>
          <div class="ig-mapel-name">${m.mapel}</div>
          <div class="ig-mapel-count">${count > 0 ? count + " media" : "Belum ada media"}</div>
        </a>`;
    }).join("");
  }

  async function loadCounts() {
    // Render dulu tanpa jumlah supaya menu langsung terlihat walau fetch masih berjalan/gagal —
    // fitur ini tidak boleh terasa "rusak" hanya karena APPS_SCRIPT_URL belum dikonfigurasi untuk
    // Galeri Visual (mis. sheet "Data Infografis" belum pernah diisi).
    renderGrid({});
    if (typeof MPLS_CONFIG === "undefined" || !MPLS_CONFIG.APPS_SCRIPT_URL) return;
    try {
      const res = await fetch(MPLS_CONFIG.APPS_SCRIPT_URL + "?infografis=1");
      const json = await res.json();
      if (json.status === "error") throw new Error(json.message || "Gagal memuat");
      const countBySlug = {};
      (json.data || []).forEach((row) => {
        const mapelName = row["Mapel"];
        const found = window.INFOGRAFIS_MAPEL.find((m) => m.mapel === mapelName);
        const slug = found ? found.mapelSlug : null;
        if (slug) countBySlug[slug] = (countBySlug[slug] || 0) + 1;
      });
      renderGrid(countBySlug);
    } catch (err) {
      // Diamkan secara sengaja di tampilan menu (bukan error yang menghalangi navigasi) — jumlah
      // media memang cuma informasi tambahan, siswa/guru tetap bisa masuk ke tiap mapel walau
      // jumlahnya gagal dimuat.
      statusEl.textContent = "";
    }
  }

  document.addEventListener("user-verified", () => {
    document.getElementById("checking").remove();
    document.getElementById("app-infografis").classList.remove("ma-hidden");
    loadCounts();
  });
  document.addEventListener("DOMContentLoaded", () => window.guardLoggedInPage("../index.html"));
</script>
</body>
</html>
